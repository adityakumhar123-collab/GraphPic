version: '3.8'

services:

  mongodb:
    image: mongo:7
    container_name: graphpic-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: graphpic-redis
    ports:
      - '6379:6379'
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: graphpic-qdrant
    ports:
      - '6333:6333'   # REST API
      - '6334:6334'   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: graphpic-api
    ports:
      - '3000:3000'
    env_file: .env
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  poller:
    build:
      context: .
      dockerfile: apps/poller/Dockerfile
    container_name: graphpic-poller
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  workers:
    build:
      context: apps/workers
      dockerfile: Dockerfile
    container_name: graphpic-workers
    env_file: .env
    depends_on:
      - redis
      - mongodb
      - qdrant
    restart: unless-stopped

volumes:
  mongo_data:
  qdrant_data:
